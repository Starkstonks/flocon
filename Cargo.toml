[package]
name = "flocon"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "A high-performance, SQLite-based filesystem designed specifically for containers and modern deployment workflows."
repository = "https://github.com/Starkstonks/flocon"
homepage = "https://github.com/Starkstonks/flocon"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "color"] }
ctrlc = { version = "3.4", features = ["termination"] }
fuse-backend-rs = { git = "https://github.com/Xowap/fuse-backend-rs.git", branch = "feature/mount-flags", features = ["fusedev", "virtiofs"] }
nix = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2.174"

r2d2               = "0.8"
r2d2_sqlite        = "0.31.0"
rusqlite           = { version = "0.37", features = ["blob"] }
rusqlite_migration = "2.3.0"

thiserror = "1.0"
vhost = "0.11.0"
vhost-user-backend = "0.15.0"
virtio-bindings = { version = "0.2.2", features = ["virtio-v5_0_0"] }
virtio-queue = "0.12.0"
vm-memory = { version = "0.14.1", features = ["backend-mmap", "backend-atomic"] }
vmm-sys-util = "0.12.1"